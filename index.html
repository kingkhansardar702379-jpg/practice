
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            color: #333;
        }

        header {
            background: #5b4bdb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .container {
            text-align: center;
            padding: 70px 20px;
        }

        .container h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .container p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        button {
            background: #5b4bdb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #392bb0;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My First Website</h1>
        <p>Welcome to my HTML Testing Project</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">
        <h2>Hello World!</h2>
        <p>This is my first simple HTML website.</p>
        <button onclick="alert('Website is working successfully!')">
            Click Me
        </button>
    </div>

    <footer>
        <p>© 2026 My First Website | All Rights Reserved</p>
    </footer>

</body>
</html>
